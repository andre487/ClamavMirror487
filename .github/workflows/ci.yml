name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file and install dependencies
        run: uv sync --locked --all-groups

      - name: Run checks
        run: ./clamav-mirror check

      - name: Check playbook syntax for every example
        run: |
          for inventory in inventory.example.yml inventory.dns.example.yml; do
            ./clamav-mirror --inventory "$inventory" plan --syntax-check
            ./clamav-mirror --inventory "$inventory" verify --syntax-check
          done
